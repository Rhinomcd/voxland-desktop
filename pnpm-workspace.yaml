patchedDependencies:
    electron-updater: patches/electron-updater.patch
nodeLinker: hoisted
allowBuilds:
    "@vencord/venmic": true
    electron: true
    electron-winstaller: false
    esbuild: true
pmOnFail: warn
verifyDepsBeforeRun: warn
recursiveInstall: false
packages:
    - packages/*
minimumReleaseAgeExclude:
    - electron
    - "@vencord/*"
catalog:
    vite: npm:@voidzero-dev/vite-plus-core@1.4.0
    vite-plus: 1.4.0
overrides:
    vite@*: "catalog:"
peerDependencyRules:
    allowAny:
        - vite
    allowedVersions:
        vite: "*"

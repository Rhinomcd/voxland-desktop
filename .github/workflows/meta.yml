name: Upload release metainfo

on:
    workflow_dispatch:

permissions:
    contents: write

jobs:
    update:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0

            - name: Get latest tag
              id: latest_tag
              run: |
                  tag=$(git tag --sort=-creatordate | head -n1)
                  echo "tag=$tag" >> "$GITHUB_OUTPUT"

            - name: Setup Vite+
              uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
              with:
                  node-version: 24
                  cache: true
                  run-install: |
                      args: ["--frozen-lockfile"]

            - name: Update metainfo
              run: vp run generateMeta
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Upload metainfo to release
              run: |
                  gh release upload "${{ steps.latest_tag.outputs.tag }}" dist/dev.vencord.Vesktop.metainfo.xml
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
